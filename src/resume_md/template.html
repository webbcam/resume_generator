<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <style>
    @page {
      size: letter;
      margin: 0.35in;
    }
    html, body {
      font-family: Cambria, Palatino, "Palatino Linotype", Georgia, serif;
      font-size: 9pt;
      line-height: 1.22;
      color: #000;
      margin: 0;
      padding: 0;
      background: #fff;
    }
    body {
      padding: 0;
    }
    h1 {
      font-family: Cambria, Palatino, "Palatino Linotype", Georgia, serif;
      font-size: 24pt;
      font-weight: normal;
      text-align: center;
      margin: 0 0 2pt 0;
      letter-spacing: 0;
    }
    p.contact {
      font-size: 9pt;
      text-align: center;
      margin: 0 0 6pt 0;
    }
    h2 {
      font-size: 10pt;
      font-weight: bold;
      font-style: normal;
      text-decoration: none;
      border: none;
      border-bottom: none;
      margin: 7pt 0 0 0;
      padding: 0;
    }
    h3 {
      font-size: 12pt;
      font-weight: bold;
      margin: 6pt 0 0 0;
    }
    h4 {
      font-size: 9pt;
      font-weight: bold;
      margin: 4pt 0 0 0;
    }
    p {
      font-size: 9pt;
      line-height: 1.22;
      margin: 0 0 2pt 0;
    }
    ul {
      margin: 0 0 2pt 0;
      padding-left: 16pt;
    }
    li {
      font-size: 9pt;
      line-height: 1.22;
      margin: 0;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 9pt;
      line-height: 1.22;
      margin: 0;
    }
    .row .left.italic {
      font-style: italic;
    }
    .row .right {
      font-style: normal;
      white-space: nowrap;
      padding-left: 12pt;
    }
    hr {
      border: none;
      border-top: 0.75pt solid #000;
      margin: 1pt 0 3pt 0;
    }
  </style>
</head>
<body>
{{ body }}
</body>
</html>
