[project]
name = "resume-md"
version = "0.1.0"
description = "Markdown to Cambria-styled HTML/PDF resume"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Cam Webb" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pypdf>=4.0"]

[project.scripts]
resume-md = "resume_md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/resume_md/template.html" = "resume_md/template.html"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pypdf>=4.0"]
